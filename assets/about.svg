<text x="602" y="186" class="body">AI Developer Intern on AXON · Jan–Oct 2026</text></g><g class="in" style="animation-delay:0.26s"><rect x="0" y="218" width="320" height="164" rx="18" class="tile"/><text x="24" y="258" class="lbl">FOCUS</text><rect x="24" y="274" width="148" height="24" rx="12" class="chip"/><text x="98" y="290" text-anchor="middle" class="chipt">Multi-agent systems</text><rect x="180" y="274" width="115" height="24" rx="12" class="chip"/><text x="237" y="290" text-anchor="middle" class="chipt">LLM guardrails</text><rect x="24" y="305" width="115" height="24" rx="12" class="chip"/><text x="82" y="321" text-anchor="middle" class="chipt">Local-first AI</text><rect x="147" y="305" width="122" height="24" rx="12" class="chip"/><text x="208" y="321" text-anchor="middle" class="chipt">AI benchmarking</text><rect x="24" y="336" width="115" height="24" rx="12" class="chip"/><text x="82" y="352" text-anchor="middle" class="chipt">Financial data</text></g><g class="in" style="animation-delay:0.35s"><rect x="332" y="218" width="250" height="164" rx="18" class="tile"/>
