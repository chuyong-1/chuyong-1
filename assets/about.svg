.lbl{font:700 11px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff3b3b;letter-spacing:3px}
.hero{font:800 34px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#ffffff;letter-spacing:-1px}
.h2{font:700 18px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f2f2f2;letter-spacing:-.3px}
.body{font:400 13.5px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#a3a3a3}
.dim{fill:#666}
.mono{font:600 13px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff6b6b;letter-spacing:1px}
.rule{stroke:#232325}
.chip{fill:#140808;stroke:#3d1212}
.chipt{font:600 11.5px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#ff9a9a}
.ghost{font:900 120px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:none;stroke:#ff1e1e;stroke-opacity:.08;stroke-width:1.5;letter-spacing:-4px}
.in{animation:in .8s cubic-bezier(.2,.8,.2,1) both}
.beat{animation:beat 2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes beat{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}
</style>
