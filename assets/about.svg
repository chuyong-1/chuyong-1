<style>
.t{font:500 12.5px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}
.p{fill:#ff1e1e;font-weight:700} .c{fill:#ffffff} .o{fill:#a9a9a9} .k{fill:#ff6b6b} .q{fill:#ffd0d0;font-style:italic}
.agent{font:600 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff8080;letter-spacing:1.5px}
.agent-me{font:700 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ffffff;letter-spacing:1.5px}
.core{font:800 17px 'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#fff;letter-spacing:2px}
.cap{font:600 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#7a2a2a;letter-spacing:2px}
.bar{font:600 11px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#8a8a8a}
.stat{font:600 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#7a3a3a;letter-spacing:2px}
.ready{font:700 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff3b3b;letter-spacing:2px}
.on{font:700 10px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff3b3b;letter-spacing:2px}
.spin-slow{animation:spin 30s linear infinite}
.spin-rev{animation:spin 18s linear infinite reverse}
.spin-fast{animation:spin 6s linear infinite}
.sweep{animation:spin 4s linear infinite}
.flow{stroke:#ff1e1e;stroke-opacity:.55;stroke-width:1.2;stroke-dasharray:3 6;animation:flow 1.2s linear infinite}
.ping{animation:ping 2s ease-in-out infinite}
.pulse{animation:pulse 2.4s ease-out infinite}
.breathe{animation:breathe 2.4s ease-in-out infinite}
.blink{animation:blink 1.2s steps(2,start) infinite}
.edge{animation:edge 5s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes flow{to{stroke-dashoffset:-18}}
@keyframes ping{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.6);opacity:1}}
@keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3.2);opacity:0}}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:.95}}
@keyframes blink{to{visibility:hidden}}
@keyframes edge{from{transform:translateX(-920px)}to{transform:translateX(920px)}}
</style>
