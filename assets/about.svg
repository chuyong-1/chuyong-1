<svg xmlns="http://www.w3.org/2000/svg" width="920" height="382" viewBox="0 0 920 382" role="img" aria-label="About: I build multi-agent systems that are safe to ship. The model proposes, deterministic code decides. Now: AI Software Engineer Intern at FreighAI. Previously: AI Developer Intern at Banao Technologies on AXON, January to October 2026 (pipelines, ingestion, NERVE event bus). Focus: multi-agent systems, LLM guardrails, local-first AI, AI benchmarking, financial data. Education: B.Tech CSE (AI and ML), Manipal University Jaipur, 2024 to 2028. Off the keyboard: boxer, district gold, state bronze, nationals; founded MUJ's martial arts club.">
<defs>
<radialGradient id="blob"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".35"/><stop offset=".5" stop-color="#b30000" stop-opacity=".12"/><stop offset="1" stop-color="#ff1e1e" stop-opacity="0"/></radialGradient>
<linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0">
