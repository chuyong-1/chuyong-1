<animateTransform attributeName="gradientTransform" type="translate" values="-300 0;400 0" dur="4s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="edgeA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff1e1e" stop-opacity=".7"/><stop offset=".35" stop-color="#2a2a2a"/><stop offset="1" stop-color="#2a2a2a"/></linearGradient>
<clipPath id="clipA"><rect x="0" y="0" width="566" height="206" rx="18"/></clipPath>
<clipPath id="clipE"><rect x="594" y="218" width="326" height="164" rx="18"/></clipPath>
