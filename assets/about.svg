<g clip-path="url(#clipA)"><circle cx="460" cy="40" r="170" fill="url(#blob)"><animate attributeName="cx" values="460;380;470;460" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="40;110;150;40" dur="14s" repeatCount="indefinite"/></circle></g>
