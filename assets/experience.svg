<svg xmlns="http://www.w3.org/2000/svg" width="920" height="200" viewBox="0 0 920 200" role="img" aria-label="Experience timeline: 2024 to 2028 B.Tech CSE (AI and ML) at Manipal University Jaipur, CGPA 8.5; 2025 to 2026 Founder and President of MUJ Martial Arts Club, 200+ students; since January 2026 AI Developer Intern at Banao Technologies on AXON; now AI Software Engineer Intern at FreighAI.">
<defs><linearGradient id="ln" gradientUnits="userSpaceOnUse" x1="30" y1="0" x2="900" y2="0"><stop offset="0" stop-color="#5c0000"/><stop offset="1" stop-color="#ff1e1e"/></linearGradient></defs>
<style>
.when{font:700 11px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#ff4d4d;letter-spacing:2px}
.title{font:700 15px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#f4f4f5}
.org{font:500 13px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#a3a3a3}
.note{font:400 12px 'Inter','Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif;fill:#6b6b73}
.act{font:700 9px 'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace;fill:#4ade80;letter-spacing:1.5px}
.draw{stroke-dasharray:870;stroke-dashoffset:870;animation:draw 2.2s cubic-bezier(.6,0,.2,1) .2s forwards}
.pop{opacity:0;animation:pop .6s cubic-bezier(.2,.8,.2,1) forwards}
.beat{animation:beat 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.run{animation:run 3.5s linear 2.6s infinite;opacity:0}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes beat{50%{opacity:.3;transform:scale(.6)}}
@keyframes run{0%{opacity:0;transform:translateX(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateX(870px)}}
</style>
<line x1="30" y1="78" x2="900" y2="78" stroke="#1f1f22" stroke-width="2"/>
<line x1="30" y1="78" x2="900" y2="78" stroke="url(#ln)" stroke-width="2.5" class="draw"/>
