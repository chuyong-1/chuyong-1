</g><g class="pop" style="animation-delay:1.85s">
<circle cx="708" cy="78" r="13" fill="#ff1e1e" opacity=".15"/>
<circle cx="708" cy="78" r="7" fill="#070707" stroke="#ff1e1e" stroke-width="2.5"/>
